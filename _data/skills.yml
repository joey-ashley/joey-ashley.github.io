    - Docker
    - Terraform
    - Kubernetes

- category: Data
  items:
    - PostgreSQL
    - Kafka
    - Flink
    - Redis

- category: Frontend
  items:
    - React
    - Next.js
    - Tailwind CSS

- category: Practices
  items:
    - Distributed systems design
    - Mentoring & technical leadership
    - Incident response
    - Technical writing
