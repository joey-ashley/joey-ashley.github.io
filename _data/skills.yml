# ============================================================
# Skills data file
# ------------------------------------------------------------
# Grouped skills rendered on the resume page.
#
# A note on philosophy: long lists of every technology you've ever
# touched are noise. Pick categories that reflect how you actually
# work, and list things you'd be comfortable being asked about in
# an interview.
#
# Schema (per group):
#   category: (required) Group name
#   items:    (required) List of skills/tools in this category
# ============================================================

- category: Languages
