# ============================================================
# Experience data file
# ------------------------------------------------------------
# Work history rendered on the resume page (and reusable elsewhere).
#
# Schema (per entry):
#   role:        (required) Job title
#   company:     (required) Employer name
#   company_url: (optional) Link to company site
#   location:    (optional) City or "Remote"
#   start:       (required) YYYY-MM
#   end:         (optional) YYYY-MM, or omit for "Present"
#   summary:     (required) One- or two-sentence overview of the role
#   highlights:  (optional) List of specific accomplishments — favor
#                concrete outcomes ("cut p99 latency from 800ms to 120ms")
#                over vague responsibilities ("worked on performance")
#   stack:       (optional) Key technologies used
# ============================================================

