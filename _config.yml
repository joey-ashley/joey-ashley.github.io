# ============================================================
# Site settings
# ============================================================
title: Your Name
tagline: Software engineer, designer, etc.
description: >-
  A short paragraph describing who you are and what this site is for.
  This shows up in search engine results and social media previews.
url: "https://your-username.github.io"   # No trailing slash
baseurl: ""                               # Leave blank for user/org sites

# ============================================================
# Author / contact
# ============================================================
author:
  name: Your Name
  email: you@example.com
  bio: One-sentence bio for sidebars and footers.
  avatar: /assets/images/avatar.jpg
  location: City, Country

# Social links — used in footer and meta tags
social:
  github: your-username
  linkedin: your-handle
  twitter: your-handle      # Optional, remove if unused
  mastodon: ""              # e.g. "@you@mastodon.social"
  email: you@example.com

# ============================================================
# Build settings
# ============================================================
markdown: kramdown
highlighter: rouge
permalink: /:title/         # Clean URLs for posts: /my-post/ instead of /2025/01/01/my-post/

# Use a remote theme to skip building layouts from scratch.
# Comment out if you're writing your own layouts in _layouts/.
remote_theme: mmistakes/minimal-mistakes

# Plugins (must also be in Gemfile if running Jekyll locally)
plugins:
  - jekyll-feed             # RSS feed at /feed.xml
  - jekyll-seo-tag          # <meta> tags for search/social
  - jekyll-sitemap          # sitemap.xml for search engines
  - jekyll-remote-theme     # Required for remote_theme above

# ============================================================
# Defaults — apply front matter to whole folders at once
# ============================================================
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author_profile: true

# ============================================================
# Files to exclude from the built site
# ============================================================
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - .gitignore
